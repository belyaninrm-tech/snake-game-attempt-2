<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🐍 Snake – Fruit Challenge</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surf:    #161b22;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --accent:  #58a6ff;
      --green:   #3fb950;
      --red:     #f85149;
      --yellow:  #f0c53f;
      --dim:     #484f58;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 10px;
      user-select: none;
    }

    #title {
      font-size: 1.6rem;
      letter-spacing: 4px;
      color: var(--accent);
      font-weight: bold;
    }

    /* ── HUD ───────────────────────────────── */
    #hud {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--surf);
      padding: 5px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    #hud b { color: var(--text); }
    #hud-fruit {
      background: var(--bg);
      padding: 2px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    /* ── Canvas + overlay ─────────────────── */
    #wrap { position: relative; }

    canvas {
      display: block;
      border: 2px solid var(--border);
      border-radius: 6px;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 17, 23, 0.96);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px 20px;
      overflow-y: auto;
    }
    #overlay.hidden { display: none; }

    /* ── Overlay typography ────────────────── */
    .ov-icon  { font-size: 4rem;  line-height: 1.15; text-align: center; }
    .ov-title { font-size: 1.85rem; font-weight: bold; text-align: center; line-height: 1.2; }
    .ov-sub   { font-size: 0.9rem; color: var(--muted); text-align: center; line-height: 1.65; }
    .ov-joke  {
      font-size: 0.88rem;
      color: var(--muted);
      text-align: center;
      max-width: 370px;
      line-height: 1.65;
      font-style: italic;
      border-left: 3px solid var(--accent);
      padding: 4px 0 4px 12px;
    }

    /* ── Buttons ───────────────────────────── */
    .btn {
      padding: 9px 22px;
      font-size: 0.9rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background .15s, transform .1s;
      line-height: 1;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn-g  { background: #238636; color: #fff; }
    .btn-g:hover  { background: var(--green); }
    .btn-b  { background: var(--surf); color: var(--text); border: 1px solid var(--border); }
    .btn-b:hover  { background: var(--border); }
    .btn-o  { background: #9e6a03; color: #fff; }
    .btn-o:hover  { background: #bb8009; }
    .btn-r  { background: #da3633; color: #fff; }
    .btn-r:hover  { background: var(--red); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    /* ── Level select grid ─────────────────── */
    #lvl-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 400px;
      width: 100%;
    }
    .lbtn {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 6px 8px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text);
    }
    .lbtn:hover { border-color: var(--accent); background: #1c2128; }
    .lbtn .ln { font-size: 1.35rem; font-weight: bold; color: var(--accent); }
    .lbtn .li { font-size: 1rem; }
    .lbtn .ll { font-size: 0.62rem; color: var(--muted); text-align: center; }

    /* ── Controls hint ─────────────────────── */
    #ctrl { color: var(--dim); font-size: 0.78rem; }

    /* ── Shake animation for lost ──────────── */
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }
    .shake { animation: shake .45s ease; }

    /* ── Countdown pop animation ───────────── */
    @keyframes countPop {
      0%   { transform: scale(0.2); opacity: 0; }
      65%  { transform: scale(1.3); }
      100% { transform: scale(1);   opacity: 1; }
    }
    .count-num {
      font-size: 9rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      animation: countPop 0.4s cubic-bezier(.34,1.56,.64,1) both;
    }
    .count-start {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: countPop 0.4s cubic-bezier(.34,1.56,.64,1) both;
    }
  </style>
</head>
<body>

<div id="title">🐍 SNAKE</div>

<div id="hud" style="visibility:hidden">
  LVL <b id="hv-lvl">1</b>
  &nbsp;·&nbsp;
  SCORE <b id="hv-scr">0</b>
  &nbsp;·&nbsp;
  <span id="hud-fruit">🍎 Apple</span>
  &nbsp;·&nbsp;
  <b id="hv-cnt">0</b>/20 🍽
  &nbsp;·&nbsp;
  ⏱ <b id="hv-timer">2:00</b>
</div>

<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="overlay"><!-- injected by JS --></div>
</div>

<div id="ctrl">Arrow Keys / WASD — move &nbsp;·&nbsp; P / Esc — pause</div>

<script>
(() => {
'use strict';

// ── Config ────────────────────────────────────────────────────────────────────
const CELL = 24, COLS = 25, ROWS = 25;
const W = COLS * CELL, H = ROWS * CELL;
const FRUITS_TO_WIN = 20;
const BASE_MS = 200;         // tick interval at level 1 (ms)
const TIME_LIMIT_SECS = 120; // 2-minute time limit per level

const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
canvas.width  = W;
canvas.height = H;

const overlay = document.getElementById('overlay');
const hudEl   = document.getElementById('hud');

// ── Fruits ────────────────────────────────────────────────────────────────────
// bg: glow/halo colour.  draw: custom canvas painter (no emoji needed).
const FRUITS = [
  { name: 'Banana',        emoji: '🍌', bg: '#ffe135', pts: 10 },
  { name: 'Kiwi',          emoji: '🥝', bg: '#6abf4b', pts: 12 },
  { name: 'Orange',        emoji: '🍊', bg: '#ff8c00', pts: 10 },
  { name: 'Apple',         emoji: '🍎', bg: '#ff3b30', pts: 10 },
  { name: 'Peach',         emoji: '🍑', bg: '#ffad6a', pts: 15 },
  { name: 'Pear',          emoji: '🍐', bg: '#aadc38', pts: 12 },
  { name: 'Cherries',      emoji: '🍒',         bg: '#cc0022', pts: 20 },
  { name: 'Strawberry',    emoji: '🍓', bg: '#ff2d55', pts: 15 },
  { name: 'Dragon Fruit',  draw: 'dragon',  icon: '🌸', bg: '#ff1a8c', pts: 25 },
  { name: 'Mango',         emoji: '🥭', bg: '#ffa200', pts: 18 },
];

// ── Level data ────────────────────────────────────────────────────────────────
const LVL_INFO = [
  { icon: '🐢', label: 'Beginner'  }, // 1
  { icon: '🐢', label: 'Easy'      }, // 2
  { icon: '🚶', label: 'Normal'    }, // 3
  { icon: '🚶', label: 'Moderate'  }, // 4
  { icon: '🏃', label: 'Fast'      }, // 5
  { icon: '🏃', label: 'Faster'    }, // 6
  { icon: '💨', label: 'Expert'    }, // 7
  { icon: '💨', label: 'Hard'      }, // 8
  { icon: '⚡', label: 'Insane'    }, // 9
  { icon: '⚡', label: 'Max Speed' }, // 10
];

// Base speed boosted 20% globally, then an additional 15% faster per level
function tickMs(lv) { return Math.round(BASE_MS * 0.80 * Math.pow(0.85, lv - 1)); }

// ── Jokes (one per level completion, cycling) ─────────────────────────────────
const JOKES = [
  "Why did the snake win the fruit challenge? Because it knows how to get to the core of things — literally! 🍎",
  "What do you call a snake who just ate 10 fruits? A boa-nanza of flavour! 🍌",
  "How does a snake stay in shape? It just goes with the flow — and never misses a snack! 🏃",
  "What did the snake say after finishing all the fruits? 'That was absolutely fangs-tastic!' 🐍",
  "Why is the snake so good at this game? Pure hiss-toric determination and zero impulse control! 📜",
  "What's the snake's fitness secret? Cardio, good reflexes, and never skipping fruit day! 🍊",
  "Why did the mango surrender to the snake? It heard the snake never loses its grip on a meal! 🥭",
  "What do you call a snake that plans every meal? A tactical constrictor with excellent taste! 😄",
  "Why don't snakes need grocery bags? Because they always eat everything right then and there! 🛒",
  "The snake's nutritionist said 'Eat more fruit.' The snake replied: 'Done! Where's level 11?!' ⚡",
];
let jokeI = 0;
const nextJoke = () => JOKES[jokeI++ % JOKES.length];

// ── State ─────────────────────────────────────────────────────────────────────
let screen = 'select';
let level  = 1;
let score  = 0;

let snake, dir, nextDir;
let fruitQueue, fruitPos, fruitsEaten;
let popups, tickTimer;
let startTime = null, elapsedSecs = 0;
let timedOut = false, pauseStart = null;

// ── Overlay helpers ───────────────────────────────────────────────────────────
function setOv(html) { overlay.innerHTML = html; overlay.classList.remove('hidden'); }
function hideOv()    { overlay.classList.add('hidden'); }

// ── SELECT SCREEN ─────────────────────────────────────────────────────────────
function showSelect() {
  screen = 'select';
  stop();
  hudEl.style.visibility = 'hidden';
  bgDraw();

  const btns = LVL_INFO.map((info, i) => {
    const lv = i + 1;
    return `<div class="lbtn" onclick="G.play(${lv})">
      <span class="ln">${lv}</span>
      <span class="li">${info.icon}</span>
      <span class="ll">${info.label}</span>
    </div>`;
  }).join('');

  setOv(`
    <div class="ov-icon">🐍</div>
    <div class="ov-title" style="color:var(--accent)">SNAKE</div>
    <div class="ov-sub">
      Eat all 20 fruits to complete a level.<br>Choose your difficulty:
    </div>
    <div id="lvl-grid">${btns}</div>
    <div style="font-size:0.82rem;color:var(--dim)">
      🍌 🥝 🍊 🍎 🍑 🍐 🍒 🍓 🌸 🥭
    </div>
  `);
}

// ── START LEVEL ───────────────────────────────────────────────────────────────
function play(lv) { level = lv; score = 0; beginLevel(); }

function beginLevel() {
  // Two independent shuffles of all 10 fruits = 20 total
  fruitQueue  = [...shuffle(FRUITS.map((_, i) => i)),
                 ...shuffle(FRUITS.map((_, i) => i))];
  fruitsEaten = 0;
  popups      = [];
  timedOut    = false;
  startTime   = null;
  elapsedSecs = 0;

  const cx = (COLS / 2) | 0, cy = (ROWS / 2) | 0;
  snake   = [{x: cx, y: cy}, {x: cx - 1, y: cy}, {x: cx - 2, y: cy}];
  dir     = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};

  placeFood();
  refreshHUD();
  hudEl.style.visibility = 'visible';
  showReadySequence();
}

// ── READY → COUNTDOWN → 🐍TART! ──────────────────────────────────────────────
function showReadySequence() {
  screen = 'countdown';
  draw(); // show board behind overlay so player gets a peek
  setOv(`
    <div class="ov-icon">🐍</div>
    <div class="ov-title" style="color:var(--accent)">Are you ready?</div>
    <div class="ov-sub" style="font-size:1.05rem;line-height:2">
      You have <b style="color:var(--yellow)">2 minutes</b>
      to eat <b style="color:var(--green)">20 fruits!</b>
    </div>
    <div class="ov-sub">
      Level ${level} &nbsp;·&nbsp; ${LVL_INFO[level - 1].icon} ${LVL_INFO[level - 1].label}
    </div>
  `);
  setTimeout(() => countDown(3), 3000);
}

function countDown(n) {
  if (n === 0) {
    // 🐍tart!
    setOv(`
      <div class="count-start">
        <span style="font-size:5.5rem;line-height:1">🐍</span>
        <span style="font-size:4.2rem;font-weight:900;color:var(--green);
                     letter-spacing:-1px;line-height:1">tart!</span>
      </div>
    `);
    setTimeout(launchGame, 1500);
    return;
  }
  setOv(`<div class="count-num">${n}</div>`);
  setTimeout(() => countDown(n - 1), 1000);
}

function launchGame() {
  const timerEl = document.getElementById('hv-timer');
  timerEl.textContent = '2:00';
  timerEl.style.color = '';
  startTime = Date.now();
  hideOv();
  screen = 'playing';
  go();
}

function placeFood() {
  const used = new Set(snake.map(s => `${s.x},${s.y}`));
  let x, y;
  do { x = rnd(COLS); y = rnd(ROWS); } while (used.has(`${x},${y}`));
  fruitPos = {x, y};
}

// ── GAME TICK ─────────────────────────────────────────────────────────────────
function tick() {
  if (screen !== 'playing') return;

  // 2-minute time limit
  if (startTime && (Date.now() - startTime) / 1000 >= TIME_LIMIT_SECS) {
    die(true); return;
  }

  dir = nextDir;
  const hx = ((snake[0].x + dir.x) + COLS) % COLS;
  const hy = ((snake[0].y + dir.y) + ROWS) % ROWS;

  // Self-collision (tail will vacate, so skip last segment)
  for (let i = 0; i < snake.length - 1; i++) {
    if (snake[i].x === hx && snake[i].y === hy) { die(); return; }
  }

  const ate = fruitPos.x === hx && fruitPos.y === hy;
  snake.unshift({x: hx, y: hy});
  if (!ate) snake.pop();

  if (ate) {
    const f = FRUITS[fruitQueue[fruitsEaten]];
    score += f.pts;
    fruitsEaten++;
    popups.push({x: hx * CELL + CELL / 2, y: hy * CELL, txt: `+${f.pts}`, t: 36});

    if (fruitsEaten >= FRUITS_TO_WIN) {
      elapsedSecs = Math.round((Date.now() - startTime) / 1000);
      stop();
      screen = 'win';
      draw();
      setTimeout(() => level >= 10 ? showGameComplete() : showLevelWin(), 450);
      return;
    }
    placeFood();
    refreshHUD();
  }

  draw();
  go();
}

function die(timeout = false) {
  timedOut    = timeout;
  elapsedSecs = startTime ? Math.round((Date.now() - startTime) / 1000) : 0;
  stop();
  screen = 'lost';
  draw();
  overlay.classList.add('shake');
  setTimeout(() => { overlay.classList.remove('shake'); showLost(); }, 480);
}

function go()   { tickTimer = setTimeout(tick, tickMs(level)); }
function stop() { clearTimeout(tickTimer); tickTimer = null; }

function fmtTime(s) {
  if (s < 60) return `${s} second${s !== 1 ? 's' : ''}`;
  return `${Math.floor(s / 60)}m ${s % 60}s`;
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function refreshHUD() {
  document.getElementById('hv-lvl').textContent = level;
  document.getElementById('hv-scr').textContent = score;
  document.getElementById('hv-cnt').textContent = fruitsEaten;
  if (fruitsEaten < FRUITS_TO_WIN) {
    const f = FRUITS[fruitQueue[fruitsEaten]];
    const icon = f.emoji || f.icon || '●';
    document.getElementById('hud-fruit').textContent = `${icon} ${f.name}`;
  }
}

// ── DRAWING ───────────────────────────────────────────────────────────────────
function bgDraw() {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);
  drawGrid();
}

function draw() {
  bgDraw();
  drawFood();
  drawSnake();
  drawBar();
  drawPops();
  // Countdown timer in HUD
  if (startTime && screen === 'playing') {
    const rem = Math.max(0, TIME_LIMIT_SECS - Math.floor((Date.now() - startTime) / 1000));
    const timerEl = document.getElementById('hv-timer');
    timerEl.textContent = `${Math.floor(rem / 60)}:${String(rem % 60).padStart(2, '0')}`;
    timerEl.style.color = rem <= 10 ? 'var(--red)' : '';
  }
}

function drawGrid() {
  ctx.strokeStyle = '#161b22';
  ctx.lineWidth   = 0.5;
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, H); ctx.stroke();
  }
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(W, r * CELL); ctx.stroke();
  }
}

function drawFood() {
  if (!fruitPos || fruitsEaten >= FRUITS_TO_WIN) return;
  const f  = FRUITS[fruitQueue[fruitsEaten]];
  const px = fruitPos.x * CELL + CELL / 2;
  const py = fruitPos.y * CELL + CELL / 2;
  const r  = CELL / 2 - 1;

  // Fully-opaque glow circle — always visible regardless of what's drawn on top
  ctx.shadowBlur  = 22;
  ctx.shadowColor = f.bg;
  ctx.fillStyle   = f.bg;          // solid, not semi-transparent
  ctx.beginPath();
  ctx.arc(px, py, r + 1, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  if (f.draw === 'dragon') {
    drawDragonFruit(px, py, r);
  } else {
    ctx.font         = `${CELL - 4}px serif`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.emoji, px, py);
  }
}

// Custom canvas painter: dragon fruit cross-section (hot-pink rind, white flesh, seeds)
function drawDragonFruit(px, py, r) {
  // Hot-pink rind (backing circle already drawn; draw a slightly smaller circle for crisp edge)
  ctx.fillStyle = '#ff1493';
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();

  // White ring border
  ctx.strokeStyle = '#fff';
  ctx.lineWidth   = 1.5;
  ctx.beginPath(); ctx.arc(px, py, r - 1, 0, Math.PI * 2); ctx.stroke();

  // Bright white inner flesh
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(px, py, r * 0.66, 0, Math.PI * 2); ctx.fill();

  // Black seeds as small circles (no ellipse — maximum compatibility)
  const seeds = [
    [0.10, 0.35], [0.70, 0.52], [1.40, 0.28], [2.00, 0.56],
    [2.65, 0.22], [3.30, 0.48], [3.95, 0.50], [4.60, 0.30],
    [5.20, 0.42], [5.80, 0.50], [0.40, 0.18], [1.10, 0.60],
  ];
  const ri = r * 0.60;
  ctx.fillStyle = '#111';
  seeds.forEach(([a, d]) => {
    const sx = px + Math.cos(a) * ri * d;
    const sy = py + Math.sin(a) * ri * d;
    ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI * 2); ctx.fill();
  });
  ctx.lineWidth = 1; // reset
}

function drawSnake() {
  const dead = screen === 'lost';
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    if (i === 0) {
      ctx.fillStyle = dead ? '#f85149' : '#58a6ff';
      rrect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 5);
      drawEyes(s, dead);
    } else {
      const a = Math.max(0.3, 1 - (i / snake.length) * 0.55);
      ctx.fillStyle = dead
        ? `rgba(248,81,73,${a})`
        : `rgba(31,111,235,${a})`;
      rrect(s.x * CELL + 3, s.y * CELL + 3, CELL - 6, CELL - 6, 4);
    }
  }
}

function drawEyes(s, dead) {
  const cx = s.x * CELL + CELL / 2;
  const cy = s.y * CELL + CELL / 2;
  const d  = dir;
  const ofs = d.x !== 0
    ? [{dx: d.x * 4, dy: -3}, {dx: d.x * 4, dy: 3}]
    : [{dx: -3, dy: d.y * 4}, {dx:  3, dy: d.y * 4}];

  ofs.forEach(o => {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx + o.dx, cy + o.dy, 2.5, 0, Math.PI * 2);
    ctx.fill();

    if (dead) {
      // × eyes
      ctx.strokeStyle = '#f85149';
      ctx.lineWidth   = 1.5;
      const ex = cx + o.dx, ey = cy + o.dy;
      ctx.beginPath(); ctx.moveTo(ex - 2, ey - 2); ctx.lineTo(ex + 2, ey + 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex + 2, ey - 2); ctx.lineTo(ex - 2, ey + 2); ctx.stroke();
    } else {
      ctx.fillStyle = '#0d1117';
      ctx.beginPath();
      ctx.arc(cx + o.dx + d.x, cy + o.dy + d.y, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function drawBar() {
  const bx = 10, by = H - 11, bw = W - 20, bh = 5;
  ctx.fillStyle = '#21262d';
  rrect(bx, by, bw, bh, 3);
  const pct = fruitsEaten / FRUITS_TO_WIN;
  if (pct > 0) {
    const hue = Math.round(120 - (level - 1) * 13);
    ctx.fillStyle = `hsl(${hue},70%,45%)`;
    rrect(bx, by, bw * pct, bh, 3);
  }
}

function drawPops() {
  popups = popups.filter(p => p.t > 0);
  ctx.font         = 'bold 13px system-ui';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  popups.forEach(p => {
    ctx.globalAlpha = p.t / 36;
    ctx.fillStyle   = '#3fb950';
    ctx.fillText(p.txt, p.x, p.y);
    p.y -= 0.9;
    p.t--;
  });
  ctx.globalAlpha = 1;
}

// ── LOST SCREEN ───────────────────────────────────────────────────────────────
function showLost() {
  screen = 'lost';
  const canGoEasier = level > 1;
  setOv(`
    <div class="ov-icon" style="font-size:3.5rem">
      😢<br>🐍💧
    </div>
    <div class="ov-title" style="color:var(--red)">${timedOut ? '⏰ TIME\'S UP!' : 'YOU LOST!'}</div>
    <div class="ov-sub">
      You ate <b style="color:var(--text)">${fruitsEaten} / 20</b> fruits on
      <b style="color:var(--text)">Level ${level}</b>.<br>
      Score: <b style="color:var(--text)">${score}</b><br>
      ${timedOut
        ? `You ran out of your 2 minutes after eating <b style="color:var(--text)">${fruitsEaten}</b> fruits.<br>Best of luck next time!`
        : `It took you <b style="color:var(--text)">${fmtTime(elapsedSecs)}</b> to lose. Best of luck next time!`
      }
    </div>
    <div class="btn-row">
      <button class="btn btn-g" onclick="G.replay()">↺ Replay Level ${level}</button>
      <button class="btn btn-o" ${canGoEasier ? `onclick="G.easier()"` : 'disabled'}>
        ${canGoEasier ? `↓ Go to Level ${level - 1}` : '↓ Already Easiest'}
      </button>
    </div>
    <button class="btn btn-b" onclick="G.sel()" style="font-size:0.82rem">⬅ Level Select</button>
  `);
}

// ── LEVEL WIN SCREEN ──────────────────────────────────────────────────────────
function showLevelWin() {
  screen = 'win';
  setOv(`
    <div class="ov-icon">🎉🐍🎉</div>
    <div class="ov-title" style="color:var(--green)">Level ${level} Complete!</div>
    <div class="ov-sub">
      Score: <b style="color:var(--text)">${score}</b><br>
      It took you <b style="color:var(--text)">${fmtTime(elapsedSecs)}</b>
    </div>
    <div class="ov-joke">${nextJoke()}</div>
    <button class="btn btn-g" onclick="G.next()">➡ Level ${level + 1}</button>
    <button class="btn btn-b" onclick="G.sel()" style="font-size:0.82rem">⬅ Level Select</button>
  `);
}

// ── GAME COMPLETE SCREEN ──────────────────────────────────────────────────────
function showGameComplete() {
  screen = 'gamecomplete';
  setOv(`
    <div style="font-size:4rem;text-align:center;line-height:1.15">
      👑<br>🐍<br><span style="font-size:2.5rem">✨🎊✨</span>
    </div>
    <div class="ov-title" style="color:var(--yellow)">
      You have completed<br>the game!
    </div>
    <div class="ov-sub">
      All 10 levels conquered! 🏆<br>
      Final Score: <b style="color:var(--text)">${score}</b><br>
      It took you <b style="color:var(--text)">${fmtTime(elapsedSecs)}</b>
    </div>
    <div class="ov-joke">${nextJoke()}</div>
    <button class="btn btn-g" onclick="G.sel()">🔄 Play Again</button>
  `);
}

// ── PAUSE ─────────────────────────────────────────────────────────────────────
function pause() {
  if (screen !== 'playing') return;
  screen = 'paused';
  stop();
  pauseStart = Date.now();
  const rem = Math.max(0, TIME_LIMIT_SECS - Math.floor((Date.now() - startTime) / 1000));
  setOv(`
    <div class="ov-icon">⏸️</div>
    <div class="ov-title" style="color:var(--accent)">Paused</div>
    <div class="ov-sub">
      Level ${level} &nbsp;·&nbsp; Score ${score}<br>
      Time remaining: <b style="color:var(--text)">${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}</b>
    </div>
    <button class="btn btn-g" onclick="G.resume()">▶ Resume</button>
    <button class="btn btn-b" onclick="G.sel()">⬅ Level Select</button>
  `);
}

function resume() {
  if (screen !== 'paused') return;
  // Shift startTime forward by the pause duration so the countdown stays accurate
  if (pauseStart) { startTime += Date.now() - pauseStart; pauseStart = null; }
  hideOv();
  screen = 'playing';
  go();
}

// ── Public API (used by inline onclick handlers) ──────────────────────────────
window.G = {
  play:   lv => play(lv),
  sel:    ()  => showSelect(),
  replay: ()  => { score = 0; beginLevel(); },
  easier: ()  => { level = Math.max(1, level - 1); score = 0; beginLevel(); },
  next:   ()  => { level++; beginLevel(); },
  resume: ()  => resume(),
};

// ── Keyboard input ────────────────────────────────────────────────────────────
const DIRS = {
  ArrowUp:    {x:  0, y: -1},
  ArrowDown:  {x:  0, y:  1},
  ArrowLeft:  {x: -1, y:  0},
  ArrowRight: {x:  1, y:  0},
  w: {x: 0, y: -1}, s: {x: 0, y:  1},
  a: {x: -1, y: 0}, d: {x: 1, y:  0},
};

document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (screen === 'playing') { pause();  return; }
    if (screen === 'paused')  { resume(); return; }
    return;
  }
  if (screen !== 'playing') return;
  const d = DIRS[k] || DIRS[k.toLowerCase()];
  if (!d || (d.x === -dir.x && d.y === -dir.y)) return;
  nextDir = d;
  e.preventDefault();
});

// ── Utilities ─────────────────────────────────────────────────────────────────
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function rnd(n)  { return (Math.random() * n) | 0; }
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
showSelect();
})();
</script>
</body>
</html>
